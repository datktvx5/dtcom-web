name: Build official-only 2025+ staging V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build official-only staging V2
        run: node scripts/build-official-catalog-2025plus-v2.js
      - name: Commit staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/official-2025plus-v2 media/official-2025plus-v2 reports/official-2025plus-v2
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build official-only 2025+ staging V2"
            git push
          fi
