name: Build official-only 2025+ product staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build official-only staging catalog
        run: node scripts/build-official-catalog-2025plus.js
      - name: Commit staging products and official images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/official-2025plus media/official-2025plus reports/official-2025plus
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build official-only 2025+ product staging"
            git push
          fi
