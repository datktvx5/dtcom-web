name: Clean and rebuild Reyee products FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure clean Reyee media exists
        run: |
          if [ ! -d "media/reyee-clean" ]; then
            if [ -f "reyee-clean-media.zip" ]; then
              mkdir -p media
              rm -rf media/reyee-clean
              unzip -o reyee-clean-media.zip -d media
            else
              echo "ERROR: missing media/reyee-clean and reyee-clean-media.zip"
              exit 1
            fi
          fi
          find media/reyee-clean -type f | head -30
          test -n "$(find media/reyee-clean -type f -print -quit)"

      - name: Replace old Reyee products with clean set
        run: node scripts/apply-reyee-cleanup.js

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git status --short
          git commit -m "Clean and rebuild Reyee catalog"
          git fetch origin main
          if ! git push origin HEAD:main; then
            git rebase origin/main
            git push origin HEAD:main
          fi
