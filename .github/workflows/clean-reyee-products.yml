name: Clean and rebuild Reyee products

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Replace old Reyee products with clean official set
        run: node scripts/apply-reyee-cleanup.js
      - name: Commit clean Reyee catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-network.json imports/reyee-clean media/reyee-clean
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Clean Reyee products and specs"
            git push origin HEAD:main
          fi
