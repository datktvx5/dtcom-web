name: DTCOM Master Official Catalog 2025+

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [camera, network, laptop, desktop, printer, scanner, ram, mainboard, cpu, ssd, vga, psu]

    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PDF/image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Build ${{ matrix.group }} from official sources only
        run: node scripts/master-worker.js ${{ matrix.group }}

      - name: Upload ${{ matrix.group }} result
        uses: actions/upload-artifact@v4
        with:
          name: official-${{ matrix.group }}
          path: build/master/${{ matrix.group }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync latest main BEFORE generating changes
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download all successful group results
        uses: actions/download-artifact@v4
        with:
          pattern: official-*
          path: downloaded-master
          merge-multiple: false

      - name: Normalize artifact directories
        run: |
          python3 - <<'PY'
          import os, shutil
          root='downloaded-master'
          for name in list(os.listdir(root)):
              if not name.startswith('official-'):
                  continue
              group=name[len('official-'):]
              src=os.path.join(root,name)
              dst=os.path.join(root,group)
              if os.path.exists(dst):
                  shutil.rmtree(dst)
              shutil.move(src,dst)
          PY

      - name: Publish official catalog to live JSON
        run: node scripts/master-merge-publish.js

      - name: Commit live catalog and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products-camera.json products-network.json products-computer.json products-printer.json media/official-2025plus-master reports/official-2025plus-master

          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi

          git commit -m "Publish DTCOM official-only 2025+ catalog"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push conflict, retrying..."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Could not safely rebase generated catalog."
              exit 1
            }
          done

          echo "Push failed after 3 attempts."
          exit 1
