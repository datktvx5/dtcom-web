name: Enrich Reyee images and specs V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download galleries and update exact specs
        run: node scripts/enrich-reyee-images-specs-v4.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-network.json media/reyee reports/reyee-images-specs-v4.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Enrich Reyee galleries and official specs V4"
            git push
          fi
