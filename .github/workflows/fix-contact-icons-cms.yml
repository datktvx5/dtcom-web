name: Fix contact icons and floating buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install YAML library
        run: npm install yaml@2.8.1

      - name: Fix footer icons and add floating button CMS
        run: node scripts/fix-contact-icons-cms.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml homepage.json contact-icons-fix.css contact-icons-fix.js *.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Align contact icons and add floating contact CMS controls"
          git push origin HEAD:main
