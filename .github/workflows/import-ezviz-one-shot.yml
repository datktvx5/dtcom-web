name: Import EZVIZ official products ONE SHOT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ezviz:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build EZVIZ products from official pages
        run: node scripts/import-ezviz-one-shot.js

      - name: Show QA report
        run: |
          cat reports/ezviz-import-final.csv
          echo
          echo "Downloaded EZVIZ media:"
          find media/ezviz-official -type f | sort | head -250 || true

      - name: Commit EZVIZ catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products-camera.json media/ezviz-official reports/ezviz-import-final.csv

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Add EZVIZ official camera catalog"
          git push origin HEAD:main
