name: Import Reyee products and download images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import products and download official images
        run: node scripts/import-reyee-products-images.js

      - name: Commit generated products and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-network.json media/reyee reports/reyee-image-import.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Reyee products and local images"
            git push
          fi
