name: Install Header Footer CMS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install YAML library
        run: npm install yaml@2.8.1

      - name: Install Header Footer CMS controls
        run: node scripts/install-header-footer-cms.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .pages.yml homepage.json site-contact-cms.js *.html

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Add CMS controls for header and footer"
          git push origin HEAD:main
