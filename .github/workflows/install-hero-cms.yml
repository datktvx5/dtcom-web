name: Install Hero Banner CMS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install YAML library
        run: npm install yaml@2.8.1

      - name: Add Banner trang chu to Pages CMS
        run: node scripts/install-hero-cms.js

      - name: Commit CMS configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml homepage.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Add homepage hero banner CMS control"
          git push origin HEAD:main
