name: Organize product and project media

on:
  push:
    branches: [main]
    paths:
      - 'products-*.json'
      - 'projects.json'
      - 'media/**'
      - '!media/reyee-official/**'
      - '.pages.yml'
      - 'scripts/organize-product-media.js'
      - '.github/workflows/organize-product-media.yml'

permissions:
  contents: write

concurrency:
  group: organize-media-main
  cancel-in-progress: false

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Organize products, projects and media
        run: node scripts/organize-product-media.js

      - name: Commit automatic updates
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             products-camera.json             products-computer.json             products-printer.json             products-network.json             projects.json             media             .pages.yml

          git commit -m "chore: organize products projects and media"
          git push
