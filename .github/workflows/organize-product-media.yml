name: Organize product media

on:
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'media/**'
      - '.pages.yml'
      - 'scripts/organize-product-media.js'
      - '.github/workflows/organize-product-media.yml'

permissions:
  contents: write

concurrency:
  group: organize-product-media-main
  cancel-in-progress: false

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Organize media and learn quick-select options
        run: node scripts/organize-product-media.js
      - name: Commit automatic updates
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json media .pages.yml
          git commit -m "chore: organize product data and options"
          git push
