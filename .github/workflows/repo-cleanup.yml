name: DTCOM repo cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = chỉ xem; apply = xóa thật"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Preview or apply cleanup
        run: node scripts/repo-cleanup.js "${{ inputs.mode }}"

      - name: Commit cleanup
        if: ${{ inputs.mode == 'apply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git status --short
          git commit -m "Clean obsolete DTCOM workflows and Reyee files"
          git push origin HEAD:main
