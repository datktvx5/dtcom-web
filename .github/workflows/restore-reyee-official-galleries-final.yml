name: Restore Reyee official galleries FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Restore official Reyee galleries
        run: node scripts/restore-reyee-official-galleries-final.js

      - name: Show result
        run: |
          cat reports/reyee-gallery-final.csv
          echo "Downloaded files:"
          find media/reyee-official -type f | sort | head -200 || true

      - name: Commit gallery files and product JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-network.json media/reyee-official reports/reyee-gallery-final.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore Reyee official product galleries"
          git push origin HEAD:main
