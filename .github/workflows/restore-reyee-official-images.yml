name: Restore Reyee official product galleries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Restore official Reyee galleries only
        run: node scripts/restore-reyee-official-images.js

      - name: Commit restored images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A products-network.json media/reyee-clean reports/reyee-image-restore-official.csv
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Restore Reyee official product galleries"
          git push origin HEAD:main
