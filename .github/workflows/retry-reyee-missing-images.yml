name: Retry missing Reyee product images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retry missing images
        run: node scripts/retry-reyee-missing-images.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-network.json media/reyee reports/reyee-missing-images-retry.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Retry missing Reyee product images"
            git push
          fi
