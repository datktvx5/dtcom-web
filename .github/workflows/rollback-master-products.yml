name: Rollback wrong MASTER products

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Remove MASTER-imported products only
        run: node scripts/rollback-master-products.js

      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products-camera.json products-network.json products-computer.json products-printer.json
          git add -A media/official-2025plus-master reports/official-2025plus-master

          if git diff --cached --quiet; then
            echo "Nothing to rollback"
            exit 0
          fi

          git commit -m "Rollback incorrect MASTER product import"
          git push origin HEAD:main
