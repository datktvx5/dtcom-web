                label: Hãng Máy in mới
                type: string
              - name: printer_model
                label: Mã / Model Máy in
                type: string
                description: "Ví dụ: LBP2900, HL-L2321D, L3250..."
              - name: printer_type
                label: Loại Máy in
                type: select
                options:
                  values:
                    - "Laser đen trắng"
