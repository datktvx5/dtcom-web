  - name: networks
    label: Thiết bị mạng
    type: file
    path: products-network.json
    format: json
    fields:
      - name: items
        label: Danh sách sản phẩm Thiết bị mạng
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, label: Mã sản phẩm / đường dẫn, type: string, hidden: true }
          - { name: name, label: Tên sản phẩm, type: string, required: true }
          - name: subcategory
            label: Nhóm sản phẩm
            type: select
            required: true
            options:
              values: [Router, "Access Point", Switch, "Firewall / Gateway", "Mesh WiFi", "Converter / SFP", "Cáp & phụ kiện mạng"]
          - name: brand
            label: Hãng
            type: select
            required: true
            options:
              values: ["TP-Link", Ruijie, Reyee, MikroTik, Ubiquiti, Cisco, Aruba, Tenda, "D-Link", DrayTek, Fortinet, HPE, Netgear, Totolink, Mercusys, Khác]
          - { name: price, label: Giá bán, type: number, required: true }
