                    - "20 - 29 trang/phút"
                    - "30 - 39 trang/phút"
                    - "40 - 49 trang/phút"
                    - "Từ 50 trang/phút"
                    - "Khác / thêm mới"
              - name: printer_speed_new
                label: Tốc độ in mới
                type: string

          - name: network
            label: Thiết bị mạng
