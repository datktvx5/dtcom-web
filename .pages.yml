              - name: computer_refresh_new
                label: Tần số quét mới
                type: string

          - name: printer
            label: Máy in / Máy scan
            fields:
              - name: printer_brand
                label: Hãng Máy in
                type: select
                required: true
                options:
                  values:
                    - "Canon"
                    - "HP"
                    - "Brother"
                    - "Epson"
                    - "Pantum"
                    - "Ricoh"
                    - "Xerox"
                    - "Fujifilm Business Innovation"
                    - "Kyocera"
                    - "Konica Minolta"
                    - "Lexmark"
                    - "Samsung"
                    - "Oki"
                    - "Zebra"
                    - "Godex"
                    - "Xprinter"
