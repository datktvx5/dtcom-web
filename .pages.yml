media:
  input: media
  output: /media

content:
  - name: cameras
    label: Camera
    type: file
    path: products-camera.json
    format: json
    fields:
      - name: items
        label: Danh sách sản phẩm Camera
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, label: Mã sản phẩm / đường dẫn, type: string, hidden: true }
          - { name: name, label: Tên sản phẩm, type: string, required: true }
          - { name: price, label: Giá bán, type: number, required: true }
          - { name: old_price, label: Giá cũ, type: number }
          - { name: shopee_link, label: Link Shopee Affiliate, type: string }
          - name: images
            label: Ảnh sản phẩm
            type: image
            options:
              multiple: { max: 10 }
              unique: true
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: video
            label: Video sản phẩm
            type: file
            options:
              categories: [video]
              extensions: [mp4, webm]
              rename: safe
          - { name: featured, label: Sản phẩm nổi bật, type: boolean }
          - name: description
            label: Mô tả
            type: text
            options: { rows: 10 }

