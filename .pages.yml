media:
  input: media
  output: /media

content:
  - name: products
    label: Sản phẩm
    type: file
    path: products.json
    format: json
    list: true
    fields:
      - name: id
        label: Mã sản phẩm / đường dẫn
        type: string
        hidden: true
      - name: name
        label: Tên sản phẩm
        type: string
        required: true
      - name: category
        label: Danh mục
        type: string
        hidden: true
      - name: subcategory
        label: Nhóm con
        type: string
        hidden: true
      - name: brand
        label: Thương hiệu
        type: string
        hidden: true
      - name: model
        label: Mã / Model
        type: string
        hidden: true

      - name: quick_specs
        label: Chọn nhóm sản phẩm và thông số nhanh
        type: block
        list:
          min: 1
          max: 1
          collapsible:
            collapsed: false
            summary: "{kind}"
        blockKey: kind
        blocks:
          - name: camera
            label: Camera
            fields:
              - name: camera_brand
                label: Hãng Camera
                type: select
                required: true
                options:
                  values:
                    - "IMOU"
                    - "EZVIZ"
                    - "Hikvision"
                    - "Dahua"
                    - "KBVision"
                    - "TP-Link / Tapo"
                    - "Xiaomi"
                    - "Reolink"
                    - "Uniview"
                    - "Vantech"
                    - "Yoosee"
                    - "Axis"
                    - "Bosch"
                    - "Hanwha Vision"
                    - "Tiandy"
                    - "TVT"
                    - "Khác / thêm mới"
              - name: camera_brand_new
                label: Hãng Camera mới
                type: string
                description: Chỉ nhập khi chọn "Khác / thêm mới".
              - name: camera_model
                label: Mã / Model Camera
                type: string
                description: "Ví dụ: IPC-A32EP-L, DS-2CD1043G2-LIU..."
              - name: camera_type
                label: Loại Camera
                type: select
                options:
                  values:
                    - "Camera WiFi trong nhà"
                    - "Camera WiFi ngoài trời"
                    - "Camera IP PoE"
                    - "Camera IP LAN"
                    - "Camera 4G"
                    - "Camera PTZ / Speed Dome"
                    - "Camera 360 độ"
                    - "Camera Dome"
                    - "Camera Bullet / Thân trụ"
                    - "Camera Analog HD"
                    - "Camera hành trình"
                    - "Chuông cửa Camera"
                    - "Khác / thêm mới"
              - name: camera_type_new
                label: Loại Camera mới
                type: string
              - name: camera_resolution
                label: Độ phân giải
                type: select
                options:
                  values:
                    - "2MP / Full HD 1080p"
                    - "3MP / 2K"
                    - "4MP / 2K+"
                    - "5MP"
                    - "6MP"
                    - "8MP / 4K"
                    - "12MP"
                    - "Khác / thêm mới"
              - name: camera_resolution_new
                label: Độ phân giải mới
                type: string
              - name: camera_connection
                label: Kết nối
                type: select
                options:
                  multiple: true
                  values:
                    - "WiFi 2.4GHz"
                    - "WiFi 2.4GHz / 5GHz"
                    - "LAN RJ45"
                    - "PoE"
                    - "4G LTE"
                    - "Bluetooth"
                    - "Khác / thêm mới"
              - name: camera_connection_new
                label: Kết nối mới
                type: string
              - name: camera_lens
                label: Ống kính
                type: select
                options:
                  values:
                    - "2.8mm"
                    - "3.6mm"
                    - "4mm"
                    - "6mm"
                    - "8mm"
                    - "12mm"
                    - "Varifocal / Thay đổi tiêu cự"
                    - "Dual Lens / 2 ống kính"
                    - "Khác / thêm mới"
              - name: camera_lens_new
                label: Ống kính mới
                type: string
              - name: camera_night
                label: Quan sát ban đêm
                type: select
                options:
                  values:
                    - "Hồng ngoại IR"
                    - "Có màu ban đêm"
                    - "Smart Dual Light"
                    - "Starlight"
                    - "Không hỗ trợ"
                    - "Khác / thêm mới"
              - name: camera_night_new
                label: Chế độ ban đêm mới
                type: string
              - name: camera_audio
                label: Âm thanh
                type: select
                options:
                  values:
                    - "Không Mic"
                    - "Mic tích hợp"
                    - "Mic + Loa / Đàm thoại 2 chiều"
                    - "Mic rời"
                    - "Khác / thêm mới"
              - name: camera_audio_new
                label: Âm thanh mới
                type: string
              - name: camera_storage
                label: Lưu trữ
                type: select
                options:
                  multiple: true
                  values:
                    - "MicroSD tối đa 64GB"
                    - "MicroSD tối đa 128GB"
                    - "MicroSD tối đa 256GB"
                    - "MicroSD tối đa 512GB"
                    - "NVR"
                    - "DVR / XVR"
                    - "NAS"
                    - "Cloud"
                    - "Khác / thêm mới"
              - name: camera_storage_new
                label: Lưu trữ mới
                type: string
              - name: camera_ai
                label: Tính năng AI
                type: select
                options:
                  multiple: true
                  values:
                    - Phát hiện chuyển động
                    - Phát hiện người
                    - Phát hiện phương tiện
                    - Theo dõi thông minh
                    - Phát hiện âm thanh bất thường
                    - Nhận diện khuôn mặt
                    - Hàng rào ảo / Xâm nhập
                    - Cảnh báo còi / đèn
                    - Auto Tracking

          - name: computer
            label: Máy tính / Laptop / Linh kiện
            fields:
              - name: computer_brand
                label: Hãng Máy tính / Linh kiện
                type: select
                required: true
                options:
                  values:
                    - "Acer"
                    - "ASUS"
                    - "Dell"
                    - "HP"
                    - "Lenovo"
                    - "MSI"
                    - "Gigabyte"
                    - "Apple"
                    - "Intel"
                    - "AMD"
                    - "NVIDIA"
                    - "Kingston"
                    - "Corsair"
                    - "G.Skill"
                    - "Crucial"
                    - "Samsung"
                    - "Western Digital"
                    - "Seagate"
                    - "Lexar"
                    - "TeamGroup"
                    - "Cooler Master"
                    - "DeepCool"
                    - "Thermaltake"
                    - "Antec"
                    - "Logitech"
                    - "Razer"
                    - "Rapoo"
                    - "AOC"
                    - "LG"
                    - "ViewSonic"
                    - "BenQ"
                    - "Philips"
                    - "Khác / thêm mới"
              - name: computer_brand_new
