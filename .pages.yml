  - name: projects
    label: Công trình tiêu biểu
    type: file
    path: projects.json
    format: json
    fields:
      - name: items
        label: Danh sách công trình
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: Mã công trình / đường dẫn
            type: string
            hidden: true
          - name: title
            label: Tên công trình
            type: string
            required: true
          - name: project_type
            label: Loại công trình
            type: select
            required: true
            options:
              values:
                - Hệ thống Camera
                - Mạng LAN / WiFi
                - Phòng máy / Máy tính
                - Hệ thống Máy in
                - Hệ thống tổng hợp
                - Khác
          - name: location
            label: Địa điểm
            type: string
          - name: customer
            label: Khách hàng / Đơn vị
            type: string
          - name: completed
            label: Thời gian hoàn thành
            type: string
          - name: images
            label: Hình ảnh công trình
            type: image
            options:
              multiple:
                max: 20
              unique: true
              extensions:
                - jpg
                - jpeg
                - png
                - webp
              rename: safe
          - name: video
            label: Video công trình
            type: file
            options:
              categories:
                - video
              extensions:
                - mp4
                - webm
              rename: safe
          - name: featured
            label: Hiển thị trên trang chủ
            type: boolean
          - name: description
            label: Giới thiệu công trình
            type: text
            options:
              rows: 10
  - name: homepage_banner
    label: Banner trang chủ
    type: file
    path: homepage.json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: hero_image
        label: Ảnh Hero Banner
        type: image
        required: true
        description: Chọn hoặc tải ảnh PNG dùng cho banner lớn đầu trang. Khuyến nghị
          1920 × 800 px.
        options:
          extensions:
            - png
          categories:
            - image
          rename: false
  - name: homepage_ticker
    label: Chữ chạy đầu trang
    type: file
    path: homepage.json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: top_ticker
        label: Cài đặt chữ chạy
        type: object
        fields:
          - name: enabled
            label: Bật chữ chạy
            type: boolean
          - name: text
            label: Nội dung chữ chạy
            type: text
            required: true
            description: Có thể dùng tiếng Việt, ký tự đặc biệt và emoji như 🎉 🔥 🎁 📞 ⭐.
          - name: link
            label: Link khi bấm vào chữ chạy
            type: string
            description: "Có thể để trống. Ví dụ: /products.html"
          - name: background_color
            label: Màu nền
            type: select
            required: true
            options:
              values:
                - name: "#0B2D55"
                  label: Xanh navy DTCOM
                - name: "#087CF0"
                  label: Xanh điện
                - name: "#005EAA"
                  label: Xanh công nghệ
                - name: "#111827"
                  label: Đen xanh
                - name: "#000000"
                  label: Đen
                - name: "#D71920"
                  label: Đỏ khuyến mãi
                - name: "#B91C1C"
                  label: Đỏ đậm
                - name: "#F59E0B"
                  label: Cam vàng
                - name: "#16A34A"
                  label: Xanh lá
                - name: "#7C3AED"
                  label: Tím
          - name: text_color
            label: Màu chữ
            type: select
            required: true
            options:
              values:
                - name: "#FFFFFF"
                  label: Trắng
                - name: "#FFD400"
                  label: Vàng nổi bật
                - name: "#67E8F9"
                  label: Xanh cyan
                - name: "#BAE6FD"
                  label: Xanh nhạt
                - name: "#FDE68A"
                  label: Vàng nhạt
                - name: "#000000"
                  label: Đen
          - name: font_family
            label: Font chữ
            type: select
            required: true
            options:
              values:
                - name: Arial, sans-serif
                  label: Arial
                - name: Tahoma, sans-serif
                  label: Tahoma
                - name: Verdana, sans-serif
                  label: Verdana
                - name: "'Trebuchet MS', sans-serif"
                  label: Trebuchet MS
                - name: Georgia, serif
                  label: Georgia
                - name: system-ui
                  label: Mặc định hiện đại
          - name: font_size
            label: Cỡ chữ
            type: select
            required: true
            options:
              values:
                - name: "12"
                  label: Nhỏ - 12 px
                - name: "14"
                  label: Vừa - 14 px
                - name: "16"
                  label: Lớn - 16 px
                - name: "18"
                  label: Rất lớn - 18 px
          - name: font_weight
            label: Độ đậm chữ
            type: select
            required: true
            options:
              values:
                - name: "400"
                  label: Thường
                - name: "500"
                  label: Vừa
                - name: "600"
                  label: Hơi đậm
                - name: "700"
                  label: Đậm
                - name: "800"
                  label: Rất đậm
          - name: speed_seconds
            label: Tốc độ di chuyển
            type: select
            required: true
            options:
              values:
                - name: "10"
                  label: Rất nhanh
                - name: "15"
                  label: Nhanh
                - name: "22"
                  label: Vừa
                - name: "30"
                  label: Chậm
                - name: "40"
                  label: Rất chậm
          - name: height
            label: Chiều cao thanh
            type: select
            required: true
            options:
              values:
                - name: "30"
                  label: Mỏng - 30 px
                - name: "36"
                  label: Vừa - 36 px
                - name: "42"
                  label: Cao - 42 px
                - name: "48"
                  label: Rất cao - 48 px
          - name: pause_on_hover
            label: Dừng khi rê chuột
            type: boolean
