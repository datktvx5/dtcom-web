      - name: price
        label: Giá bán
        type: number
        required: true
      - name: old_price
        label: Giá cũ
        type: number
      - name: warranty
        label: Bảo hành
        type: select
        options:
          values:
            - "1 tháng"
            - "12 tháng"
            - "18 tháng"
            - "24 tháng"
            - "3 tháng"
            - "36 tháng"
            - "6 tháng"
            - "60 tháng"
            - "Không bảo hành"
            - "Khác / thêm mới"
      - name: warranty_new
        label: Bảo hành mới
        type: string
        description: Chỉ nhập khi chọn "Khác / thêm mới".
      - name: shopee_link
        label: Link Shopee Affiliate
        type: string
      - name: images
        label: Ảnh sản phẩm
        type: image
        options:
          multiple:
            max: 10
          unique: true
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: video
        label: Video sản phẩm
        type: file
        options:
          categories: [video]
          extensions: [mp4, webm]
          rename: safe
      - name: featured
        label: Sản phẩm nổi bật
        type: boolean
      - name: description
        label: Mô tả
        type: text
        options:
          rows: 6
      - name: specs
        label: Thông số bổ sung / Ghi chú kỹ thuật
        type: text
        description: Chỉ nhập thêm những thông số chưa có trong phần chọn nhanh phía trên.
        options:
          rows: 8
