media:
  input: media
  output: /media

content:
  - name: cameras
    label: Camera
    type: file
    path: products-camera.json
    format: json
    fields:
      - name: items
        label: Danh sách sản phẩm Camera
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, label: Mã sản phẩm / đường dẫn, type: string, hidden: true }
          - { name: name, label: Tên sản phẩm, type: string, required: true }
          - name: subcategory
            label: Nhóm sản phẩm
            type: select
            required: true
            options:
              values: ["Camera trong nhà", "Camera ngoài trời", "Camera IP PoE", "Camera PTZ / 360", "Camera Analog", "Đầu ghi", "Phụ kiện Camera"]
          - name: brand
            label: Hãng
            type: select
            required: true
            options:
              values: [IMOU, EZVIZ, Hikvision, Dahua, KBVision, "TP-Link / Tapo", Xiaomi, Reolink, Uniview, Vantech, Yoosee, Axis, Bosch, "Hanwha Vision", Tiandy, TVT, Khác]
          - { name: price, label: Giá bán, type: number, required: true }
          - { name: old_price, label: Giá cũ, type: number }
          - { name: shopee_link, label: Link Shopee Affiliate, type: string }
          - name: images
            label: Ảnh sản phẩm
            type: image
            options:
              multiple: { max: 10 }
              unique: true
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: video
            label: Video sản phẩm
            type: file
            options:
              categories: [video]
              extensions: [mp4, webm]
              rename: safe
          - { name: featured, label: Sản phẩm nổi bật, type: boolean }
          - name: description
            label: Mô tả
            type: text
            options: { rows: 10 }

  - name: computers
    label: Máy tính
    type: file
    path: products-computer.json
    format: json
    fields:
      - name: items
        label: Danh sách sản phẩm Máy tính
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, label: Mã sản phẩm / đường dẫn, type: string, hidden: true }
          - { name: name, label: Tên sản phẩm, type: string, required: true }
          - name: subcategory
            label: Nhóm sản phẩm
            type: select
            required: true
            options:
              values: [Laptop, "Máy tính để bàn", "Màn hình", "Linh kiện", "Phụ kiện"]
          - name: product_type
            label: Loại chi tiết (nếu cần)
            type: select
            options:
              values: [CPU, Mainboard, RAM, "SSD / HDD", VGA, "Nguồn / PSU", Case, "Tản nhiệt", "Bàn phím", Chuột, Webcam, "Tai nghe", Khác]
          - name: brand
            label: Hãng
            type: select
            required: true
            options:
              values: [Acer, ASUS, Dell, HP, Lenovo, MSI, Gigabyte, Apple, Intel, AMD, NVIDIA, Kingston, Corsair, "G.Skill", Crucial, Samsung, "Western Digital", Seagate, Lexar, TeamGroup, Logitech, Razer, Rapoo, AOC, LG, ViewSonic, BenQ, Philips, Khác]
          - { name: price, label: Giá bán, type: number, required: true }
          - { name: old_price, label: Giá cũ, type: number }
          - { name: shopee_link, label: Link Shopee Affiliate, type: string }
          - name: images
            label: Ảnh sản phẩm
            type: image
            options:
              multiple: { max: 10 }
              unique: true
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: video
            label: Video sản phẩm
            type: file
            options:
              categories: [video]
              extensions: [mp4, webm]
              rename: safe
          - { name: featured, label: Sản phẩm nổi bật, type: boolean }
          - name: description
            label: Mô tả
            type: text
            options: { rows: 10 }

