              - name: computer_model
                label: Mã / Model
                type: string
              - name: computer_type
                label: Loại sản phẩm
                type: select
                options:
                  values:
                    - "Laptop"
                    - "PC Văn phòng"
                    - "PC Gaming"
                    - "Mini PC"
                    - "All-in-One"
                    - "Màn hình"
                    - "Mainboard"
                    - "CPU"
                    - "RAM"
                    - "SSD"
                    - "HDD"
                    - "VGA / Card đồ họa"
                    - "Nguồn / PSU"
                    - "Case"
                    - "Tản nhiệt"
                    - "Bàn phím"
                    - "Chuột"
                    - "Webcam"
                    - "Tai nghe"
                    - "Khác / thêm mới"
              - name: computer_type_new
                label: Loại sản phẩm mới
                type: string
              - name: computer_cpu
                label: CPU / Dòng CPU
                type: select
                options:
                  values:
                    - "Intel Core i3"
                    - "Intel Core i5"
                    - "Intel Core i7"
                    - "Intel Core i9"
                    - "Intel Core Ultra 5"
                    - "Intel Core Ultra 7"
                    - "Intel Core Ultra 9"
                    - "AMD Ryzen 3"
                    - "AMD Ryzen 5"
                    - "AMD Ryzen 7"
                    - "AMD Ryzen 9"
                    - "Apple M1"
                    - "Apple M2"
                    - "Apple M3"
                    - "Apple M4"
                    - "Khác / thêm mới"
              - name: computer_cpu_new
                label: CPU mới
                type: string
              - name: computer_ram
                label: RAM
                type: select
                options:
                  values:
                    - "4GB"
                    - "8GB"
                    - "16GB"
                    - "24GB"
                    - "32GB"
                    - "48GB"
                    - "64GB"
                    - "128GB"
                    - "Khác / thêm mới"
              - name: computer_ram_new
                label: Dung lượng RAM mới
                type: string
              - name: computer_storage
                label: SSD / Lưu trữ
                type: select
                options:
                  values:
                    - "128GB"
                    - "256GB"
                    - "512GB"
                    - "1TB"
                    - "2TB"
                    - "4TB"
                    - "8TB"
                    - "Khác / thêm mới"
              - name: computer_storage_new
                label: Dung lượng lưu trữ mới
                type: string
              - name: computer_gpu
                label: Card đồ họa
                type: select
                options:
                  values:
                    - "Đồ họa tích hợp"
                    - "NVIDIA GeForce GTX"
                    - "NVIDIA GeForce RTX 20 Series"
                    - "NVIDIA GeForce RTX 30 Series"
                    - "NVIDIA GeForce RTX 40 Series"
                    - "NVIDIA GeForce RTX 50 Series"
                    - "AMD Radeon RX 6000 Series"
                    - "AMD Radeon RX 7000 Series"
                    - "Intel Arc"
                    - "Apple GPU"
                    - "Khác / thêm mới"
              - name: computer_gpu_new
                label: Card đồ họa mới
                type: string
              - name: computer_screen
                label: Kích thước màn hình
                type: select
                options:
                  values:
                    - "13.3 inch"
                    - "14 inch"
                    - "15.6 inch"
                    - "16 inch"
                    - "17.3 inch"
                    - "21.5 inch"
                    - "23.8 inch"
                    - "24 inch"
                    - "27 inch"
                    - "32 inch"
                    - "34 inch"
                    - "49 inch"
