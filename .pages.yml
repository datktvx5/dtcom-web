                type: string
              - name: printer_color
                label: Kiểu in
                type: select
                options:
                  values:
                    - "Đen trắng"
                    - "Màu"
                    - "Khác / thêm mới"
              - name: printer_color_new
                label: Kiểu in mới
                type: string
              - name: printer_functions
                label: Chức năng
                type: select
                options:
                  multiple: true
