                    - "A4"
                    - "A5"
                    - "A6"
                    - "B5"
                    - "Letter"
                    - "Legal"
                    - "Executive"
                    - "10x15cm"
                    - "13x18cm"
                    - "Khác / thêm mới"
              - name: printer_paper_new
