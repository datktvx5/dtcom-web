media:
  input: media
  output: /media

content:
  - name: products
    label: Sản phẩm
    type: file
    path: products.json
    format: json
    list: true
    fields:
      - name: id
        label: Mã sản phẩm / đường dẫn
        type: string
        hidden: true
      - name: name
        label: Tên sản phẩm
        type: string
        required: true
      - name: category
        label: Danh mục
        type: select
        required: true
        options:
          values:
            - Camera
            - Máy tính
            - Máy in
            - Thiết bị mạng
      - name: subcategory
        label: Nhóm con
        type: string
        hidden: true
      - name: brand
        label: Thương hiệu
        type: select
        options:
          values:
            - "Dahua"
            - "DTCOM Demo"
            - "EZVIZ"
            - "Hikvision"
            - "IMOU"
            - "KBVision"
            - "Ruijie"
            - "TP-Link / Tapo"
            - "Xiaomi"
            - "Khác / thêm mới"
      - name: brand_new
        label: Thương hiệu mới (chỉ nhập khi chưa có trong danh sách)
        type: string
      - name: price
        label: Giá bán
        type: number
        required: true
      - name: old_price
        label: Giá cũ
        type: number
      - name: warranty
        label: Bảo hành
        type: select
        options:
          values:
            - "12 tháng"
            - "18 tháng"
            - "24 tháng"
            - "3 tháng"
            - "36 tháng"
            - "6 tháng"
            - "Không bảo hành"
            - "Khác / thêm mới"
      - name: warranty_new
        label: Bảo hành mới (chỉ nhập khi chưa có trong danh sách)
        type: string
      - name: shopee_link
        label: Link Shopee Affiliate
        type: string
      - name: images
        label: Ảnh sản phẩm
        type: image
        options:
          multiple:
            max: 10
          unique: true
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: video
        label: Video sản phẩm
        type: file
        options:
          categories: [video]
          extensions: [mp4, webm]
          rename: safe
      - name: featured
        label: Sản phẩm nổi bật
        type: boolean
      - name: description
        label: Mô tả
        type: text
        options:
          rows: 6
      - name: specs
        label: Thông số kỹ thuật
        type: text
        options:
          rows: 10
